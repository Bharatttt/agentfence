services:
  gateway:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AGENTFENCE_TOKEN_HASHES: /run/secrets/token-hashes
      AGENTFENCE_DB: /app/runtime/state/agentfence.sqlite3
    secrets:
      - token-hashes
    volumes:
      - gateway-state:/app/runtime/state
    networks:
      - gateway-only
      - host-access
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  demo-agent:
    image: python:3.12-slim
    profiles: ["demo"]
    depends_on:
      gateway:
        condition: service_healthy
    command: ["python", "/demo/replay.py"]
    user: "10002:10002"
    environment:
      AGENTFENCE_URL: http://gateway:8000
      AGENTFENCE_TOKEN: ${AGENTFENCE_TOKEN:-}
    volumes:
      - ./demo:/demo:ro
    networks:
      - gateway-only
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
  llm-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    profiles: ["llm"]
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      AGENTFENCE_URL: http://gateway:8000
      AGENTFENCE_TOKEN: ${AGENTFENCE_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    networks: [gateway-only, model-egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    cpus: 0.5
  gemini-agent:
    build:
      context: .
      dockerfile: Dockerfile.gemini
    profiles: ["gemini"]
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      AGENTFENCE_URL: http://gateway:8000
      AGENTFENCE_TOKEN: ${AGENTFENCE_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
    networks: [gateway-only, model-egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    cpus: 0.5
  portal:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: Dockerfile.web
      target: portal
    ports: ["127.0.0.1:8001:8001"]
    environment:
      AGENTFENCE_URL: http://gateway:8000
      RUNNER_URL: http://chat-runner:8002
    secrets: [portal-config]
    depends_on:
      gateway:
        condition: service_healthy
      chat-runner:
        condition: service_healthy
    networks: [gateway-only, portal-runner, host-access]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 192m
    cpus: 0.5
  chat-runner:
    profiles: ["ui"]
    build:
      context: .
      dockerfile: Dockerfile.web
      target: runner
    environment:
      AGENTFENCE_URL: http://gateway:8000
    secrets: [runner-config]
    networks: [gateway-only, portal-runner, model-egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  portal-config:
    file: ./runtime/portal-config.json
  runner-config:
    file: ./runtime/runner-config.json
  token-hashes:
    file: ./runtime/token-hashes.json
volumes:
  gateway-state:
networks:
  portal-runner:
    internal: true
  host-access: {}
  model-egress: {}
  gateway-only:
    internal: true
